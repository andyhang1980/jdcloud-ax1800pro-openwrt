#CI项目
name: QCA-ALL

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，仅限一个。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.TARGET}}
    strategy:
      fail-fast: false
      matrix:
        # 只编译京东云亚瑟 AX1800 Pro（型号 RE-SS-01），闭源 QCA WiFi 驱动版本
        TARGET: [IPQ60XX-WIFI-YES]
        SOURCE: [LiBwrt/openwrt-6.x]
        # 25.12-nss = 带网络层 NSS 加速的分支（6.12 内核）
        BRANCH: [25.12-nss]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译平台
      WRT_TARGET: ${{matrix.TARGET}}
      #默认主题（design：Lean 版，带 ucode 模板）
      WRT_THEME: design
      #默认主机名（品牌统一为 QWRT）
      WRT_NAME: QWRT
      #默认WIFI名
      WRT_WIFI: QWRT
      #默认地址（QWRT 原默认）
      WRT_IP: 192.168.1.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}
