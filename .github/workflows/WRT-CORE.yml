#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_TARGET:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_WIFI:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: false
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_TEST:
        required: false
        type: string

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_TARGET: ${{inputs.WRT_TARGET}}
  WRT_THEME: ${{inputs.WRT_THEME}}
  WRT_NAME: ${{inputs.WRT_NAME}}
  WRT_WIFI: ${{inputs.WRT_WIFI}}
  WRT_IP: ${{inputs.WRT_IP}}
  WRT_PW: ${{inputs.WRT_PW}}
  WRT_REPO: ${{inputs.WRT_REPO}}
  WRT_BRANCH: ${{inputs.WRT_BRANCH}}
  WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
  WRT_TEST: ${{inputs.WRT_TEST}}
  # runner 工作目录太长，Python multiprocessing 的 forkserver AF_UNIX socket 会超过 108 字节（rust host 编译踩过）
  TMPDIR: /tmp
  TEMP: /tmp
  TMP: /tmp

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Projects
        uses: actions/checkout@main

      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@main
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "android* azure* clang* dotnet* firefox* ghc* golang* google* libclang* libgl1* lld* llvm* \
            microsoft* mongodb* mono* mysql* nodejs* openjdk* php* postgresql* powershell* snap* temurin* yarn* zulu*"
          remove_packages_one_command: true
          remove_folders: "/etc/apt/sources.list.d* /etc/mono* /etc/mysql* /usr/include/linux/android* /usr/lib/llvm* /usr/lib/mono* \
            /usr/local/lib/android* /usr/local/lib/node_modules* /usr/local/share/chromium* /usr/local/share/powershell* \
            /usr/local/share/vcpkg/ports/azure* /usr/local/share/vcpkg/ports/google* /usr/local/share/vcpkg/ports/libpq/android* \
            /usr/local/share/vcpkg/ports/llvm* /usr/local/share/vcpkg/ports/mysql* /usr/local/share/vcpkg/ports/snap* \
            /usr/share/azure* /usr/share/dotnet* /usr/share/glade* /usr/share/miniconda* /usr/share/php* /usr/share/swift \
            /var/lib/mysql* /var/log/azure*"
          testing: false

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi $(docker images -q) 2>/dev/null || true
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix
          sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.org/init_build_environment.sh)'
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Initialization Values
        run: |
          export WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d_%H.%M.%S")
          export WRT_CI=$(basename $GITHUB_WORKSPACE)
          export WRT_VER="QWRT-$WRT_BRANCH"
          export WRT_TYPE=$(sed -n "1{s/^#//;s/\r$//;p;q}" $GITHUB_WORKSPACE/Config/$WRT_TARGET.txt)

          echo "WRT_DATE=$WRT_DATE" >> $GITHUB_ENV
          echo "WRT_CI=$WRT_CI" >> $GITHUB_ENV
          echo "WRT_VER=$WRT_VER" >> $GITHUB_ENV
          echo "WRT_TYPE=$WRT_TYPE" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      - name: Check Caches
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache@main
        with:
          key: ${{env.WRT_TARGET}}-${{env.WRT_VER}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Update Caches
        if: env.WRT_TEST != 'true'
        run: |
          if ${{steps.check-cache.outputs.cache-hit == 'true'}}; then
            sed -i 's/ $(tool.*\/stamp-compile)//g' ./wrt/Makefile
            sed -i 's/ $(tool.*\/stamp-install)//g' ./wrt/Makefile

            echo "toolchain skiped done!"
          else
            gh extension install actions/gh-actions-cache || true

            CACHE_LIST=$(gh actions-cache list --key "$WRT_TARGET-$WRT_VER" | cut -f 1 || true)
            for CACHE_KEY in $CACHE_LIST; do
               gh actions-cache delete $CACHE_KEY --confirm || true
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Custom Brand & Wwan
        run: |
          cd ./wrt/
          $GITHUB_WORKSPACE/Scripts/Brand.sh ./
          $GITHUB_WORKSPACE/Scripts/Wwan.sh ./

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

          # Rust 工具链从源码编译时会去 Rust CI 下载 LLVM 构件（ci-artifacts.rust-lang.org），
          # 官方 CI 产物过期被删 -> 404 -> package/feeds/packages/rust [host] failed to build。
          # 实测：configure 阶段从未执行（日志里没有 configure.py 打印的 "Configure the build"），
          # 所以 Makefile 里 HOST_CONFIGURE_ARGS 的 --set=llvm.download-ci-llvm=false 从未生效，
          # x.py 自动创建默认 bootstrap.toml 就去下载已删除的 CI 构件。
          # 对策：直接预置 bootstrap.toml，声明 download-ci-llvm=false（Rust 官方给的修复），
          #       改为本地构建 LLVM，不再依赖会过期的 CI 产物。
          RUST_PKG_DIR=$(find ../feeds -path '*lang/rust' -type d 2>/dev/null | head -1)
          if [ -n "$RUST_PKG_DIR" ]; then
            sh "$GITHUB_WORKSPACE/Scripts/rust-llvm-fix.sh" "$RUST_PKG_DIR/bootstrap.toml"
          fi
          # 若 x.py 按自身位置（源码目录）查找 bootstrap.toml，则在 x.py 之前补建一次。
          # 源码目录此时还没解包，所以要把这句注入 Host/Compile。
          RUST_MK=$(find ../feeds -path '*lang/rust/Makefile' 2>/dev/null | head -1)
          if [ -n "$RUST_MK" ] && ! grep -q 'rust-llvm-fix.sh' "$RUST_MK"; then
            cat > /tmp/rustfix.awk <<'AWK_EOF'
          /define Host\/Compile/ { inblock = 1 }
          inblock && /x\.py/ && !done {
            printf "\tsh $${GITHUB_WORKSPACE}/Scripts/rust-llvm-fix.sh $(HOST_BUILD_DIR)/bootstrap.toml ; \\\n"
            done = 1
          }
          { print }
          AWK_EOF
            awk -f /tmp/rustfix.awk "$RUST_MK" > "$RUST_MK.new" && mv "$RUST_MK.new" "$RUST_MK"
            echo "rust Makefile patched: rust-llvm-fix.sh injected before x.py"
          fi

      - name: Custom Settings
        run: |
          cd ./wrt/

          rm -rf ./tmp* ./.config*

          cat $GITHUB_WORKSPACE/Config/$WRT_TARGET.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          make defconfig -j$(nproc)

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          # Python 3.14 把 multiprocessing 默认 start method 改成了 forkserver，
          # 它要建 AF_UNIX socket；OpenWrt host python 的临时目录在超长的
          # runner 工作目录下，路径超过 108 字节 -> rustc 的 x.py 必炸。
          # 用 sitecustomize 把默认 start method 强制成 fork（不建 socket）。
          # 只影响 Python 进程启动方式，不改包集合、不动 .config、不破坏 metadata。
          mkdir -p /tmp/pyfix
          printf 'import multiprocessing\ntry:\n    multiprocessing.set_start_method("fork", force=True)\nexcept Exception:\n    pass\n' > /tmp/pyfix/sitecustomize.py
          export PYTHONPATH="/tmp/pyfix${PYTHONPATH:+:$PYTHONPATH}"
          python3 -c "import multiprocessing,sys; print('pyfix active, start method:', multiprocessing.get_start_method(), 'python:', sys.version.split()[0])"

          make -j$(nproc) || make -j1 V=s

      # 编译失败也把工具链/ccache 存下来，下轮直接复用（已存在则跳过）
      - name: Save Toolchain Cache
        if: always() && env.WRT_TEST != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{env.WRT_TARGET}}-${{env.WRT_VER}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config_"$WRT_TARGET"_"$WRT_VER"_"$WRT_DATE".txt

          if [[ $WRT_TEST != 'true' ]]; then
            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|manifest\|sha256sums\|packages\)$" -exec rm -rf {} +

            for TYPE in $WRT_TYPE ; do
              for FILE in $(find ./bin/targets/ -type f -iname "*$TYPE*.*") ; do
                EXT=$(basename $FILE | cut -d '.' -f 2-)
                NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($TYPE\).*")
                NEW_FILE="$WRT_VER"_"$NAME"_"$WRT_DATE"."$EXT"
                mv -f $FILE ./upload/$NEW_FILE
              done
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{env.WRT_TARGET}}_${{env.WRT_VER}}_${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            这是个平台固件包，内含多个设备！
            请注意选择你需要的设备固件！
            不要问，刷就完事了！

            MTK和QCA全系带开源硬件加速，别问了！

            WIFI密码：12345678

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            平台：${{env.WRT_TARGET}}
            设备：${{env.WRT_TYPE}}
            地址：${{env.WRT_IP}}
            密码：${{env.WRT_PW}}
